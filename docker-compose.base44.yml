services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      # Keep container deps separate from the node_modules committed in the repo.
      - web_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    # Optional: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY enable trip persistence.
    env_file:
      - /run/base44/app.env

volumes:
  web_node_modules:
