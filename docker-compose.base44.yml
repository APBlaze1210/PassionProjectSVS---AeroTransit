services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - /run/base44/app.env
    depends_on:
      - api

  api:
    image: node:22
    working_dir: /app/backend
    command: sh -c "npm ci && npm run dev"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - api_node_modules:/app/backend/node_modules
      - api_data:/data
    environment:
      - CHOKIDAR_USEPOLLING=true
      - AMADEUS_BASE_URL=https://test.api.amadeus.com
      - DB_PATH=/data/aero-transit.db
    env_file:
      - /run/base44/app.env

volumes:
  web_node_modules:
  api_node_modules:
  api_data:
